packages:
  - web
  - backend
  - packages/*

saveExact: true
# Mermaid's math adapter uses the same renderToString API. Keep its transitive
# copy on the prototype-pollution fix too, rather than patching only our import.
overrides:
  tar: 7.5.22
  node-gyp: 12.4.0
  mermaid>katex: 0.18.2
nodeLinker: hoisted
injectWorkspacePackages: true
syncInjectedDepsAfterScripts:
  - build
  - test
# Install explicitly (frozen in CI); script invocations must not mutate modules
# or race an implicit reinstall when multiple quality checks run together.
verifyDepsBeforeRun: false
strictPeerDependencies: true
engineStrict: true
minimumReleaseAge: 1440
# Exact reviewed security update; published less than 24 hours ago.
minimumReleaseAgeExclude:
  - multer@2.5.0
allowBuilds:
  '@scarf/scarf': false
  sqlite3: true
  esbuild: true
  unrs-resolver: true
  '@parcel/watcher': true
  '@tailwindcss/oxide': true
  sharp: true
  vue-demi: true
patchedDependencies:
  braces@3.0.3: patches/braces@3.0.3.patch
  node-forge@1.4.0: patches/node-forge@1.4.0.patch
