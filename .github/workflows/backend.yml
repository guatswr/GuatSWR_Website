# Keep this filename stable: release-v2.yml waits for this exact workflow.
name: CI

on:
  push:
    branches: [main, 'revamp/**', 'codex/**']
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  NUXT_SESSION_PASSWORD: guatswr-ci-fixture-session-password-not-a-production-credential

jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      quality: ${{ steps.select.outputs.quality }}
      audit: ${{ steps.select.outputs.audit }}
      postgres: ${{ steps.select.outputs.postgres }}
      web: ${{ steps.select.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - id: select
        run: node scripts/ci/changes.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ci-scope
          path: .tools/ci/scope.json
          include-hidden-files: true
          retention-days: 14

  quality:
    name: Static checks and unit tests
    needs: scope
    if: needs.scope.outputs.quality == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: node -e "require('node:fs').mkdirSync('.tools/ci', {recursive:true})"
      - run: pnpm install --frozen-lockfile
        id: install
      - run: pnpm check:patches
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: pnpm test:ci
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: pnpm test:tooling
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: pnpm check:boundaries
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: pnpm typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: pnpm -r lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: pnpm --filter @guatswr/shared test --reporter=default --reporter=json --outputFile="${{ github.workspace }}/.tools/ci/shared.json"
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: pnpm --filter @guatswr/web test --reporter=default --reporter=json --outputFile="${{ github.workspace }}/.tools/ci/web-unit.json"
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - name: Publish unit metrics (missing reports fail)
        if: ${{ !cancelled() }}
        run: node scripts/ci/report.mjs vitest .tools/ci/shared.json .tools/ci/web-unit.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() }}
        with:
          name: ci-quality
          path: .tools/ci/
          include-hidden-files: true
          retention-days: 14

  postgres:
    name: PostgreSQL business and cold recovery
    needs: [scope, quality]
    if: needs.scope.outputs.postgres == 'true' && needs.quality.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @guatswr/shared build && pnpm --filter guiair-backend build
      - run: node -e "require('node:fs').mkdirSync('.tools/ci', {recursive:true})"
      - name: Reject stale compiled SQLite runtime artifacts
        run: node -e "const fs=require('node:fs');for(const p of ['database/sqlite.js','migrations/engine.js'])if(fs.existsSync('backend/dist/src/'+p))throw Error('Obsolete compiled runtime '+p)"
      - run: node --test backend/src/utils/eventContentStorage.test.js
      - run: pnpm test:database
      - name: Real business, contracts and lifecycle with no hidden skips
        run: node scripts/postgres/test-adapters.mjs --business --suite core --reporter=default --reporter=json --outputFile=${{ github.workspace }}/.tools/ci/postgres.json
      - name: Native backup, empty-target restore and application recovery
        run: node scripts/postgres/test-adapters.mjs --business --suite release --reporter=default --reporter=json --outputFile=${{ github.workspace }}/.tools/ci/recovery.json
      - run: pnpm test:migration
      - run: python scripts/test_ops.py
      - run: python backend/scripts/backup_bundle_test.py
      - run: python backend/scripts/inspect_data_test.py
      - run: python backend/scripts/migration_baseline_test.py
      - name: Publish PostgreSQL metrics
        if: ${{ !cancelled() }}
        run: node scripts/ci/report.mjs vitest .tools/ci/postgres.json .tools/ci/recovery.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() }}
        with:
          name: ci-postgres
          path: |
            .tools/ci/
            .tools/release-rehearsal-report.json
          include-hidden-files: true
          retention-days: 14

  web:
    name: Production build and BFF integration
    needs: [scope, quality]
    if: needs.scope.outputs.web == 'true' && needs.quality.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: node -e "require('node:fs').mkdirSync('.tools/ci', {recursive:true})"
      - run: pnpm install --frozen-lockfile
        id: install
      - name: Build the production artifact under test
        id: build
        run: pnpm --filter @guatswr/shared build && pnpm --filter guiair-backend build && pnpm --filter @guatswr/web build
      - name: Check production sourcemaps
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm check:artifacts
      - name: Real BFF with PostgreSQL and native backup
        run: node scripts/postgres/test-adapters.mjs --business --suite bff --reporter=default --reporter=json --outputFile=${{ github.workspace }}/.tools/ci/bff.json
        env:
          BACKEND_BFF_OUTPUT: ${{ github.workspace }}/web/.output
      - name: Publish BFF metrics
        if: ${{ !cancelled() }}
        run: node scripts/ci/report.mjs vitest .tools/ci/bff.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() }}
        with:
          name: ci-build-bff
          path: .tools/ci/
          include-hidden-files: true
          retention-days: 14

  audit:
    name: Audit dependency changes
    needs: scope
    if: needs.scope.outputs.audit == 'true'
    uses: ./.github/workflows/dependency-security.yml

  result:
    name: CI result
    needs: [scope, quality, postgres, web, audit]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Reject failed, cancelled or unexpectedly skipped checks
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/ci/report.mjs result
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() }}
        with:
          name: ci-result
          path: .tools/ci/
          include-hidden-files: true
          retention-days: 14
