name: Backend migration gates
on:
  push:
    branches: ['codex/backend-modernization', 'revamp/**', main]
    paths: ['backend/**', 'packages/shared/**', 'web/**', 'scripts/**', 'patches/**', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', '.node-version', '.npmrc', '.dockerignore', '.gitattributes', '.github/workflows/backend.yml', 'docs/backend-modernization/**']
  pull_request:
    paths: ['backend/**', 'packages/shared/**', 'web/**', 'scripts/**', 'patches/**', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', '.node-version', '.npmrc', '.dockerignore', '.gitattributes', '.github/workflows/backend.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:security
      - run: node --test scripts/revamp/upstream-security.test.mjs
      - run: pnpm typecheck
      - run: pnpm -r lint
      - run: pnpm --filter @guatswr/shared test
      - run: pnpm --filter @guatswr/web test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python backend/scripts/backup_bundle_test.py
      - run: python backend/scripts/inspect_data_test.py
      - run: python backend/scripts/migration_baseline_test.py
      - run: pnpm --filter guiair-backend test:unit
      - run: pnpm --filter guiair-backend run test:integration --reporter=default --reporter=json --outputFile=test-results/integration.json
      - run: pnpm --filter guiair-backend run test:contracts --reporter=default --reporter=json --outputFile=test-results/contracts.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-tests-${{ runner.os }}
          path: backend/test-results
          retention-days: 14
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: node backend/scripts/prepare-test-context.cjs "$RUNNER_TEMP/backend-context"
      - run: docker build -t guatswr-backend-test "$RUNNER_TEMP/backend-context"
      - run: docker run --rm --network none guatswr-backend-test
      - run: docker run --rm --network none guatswr-backend-test node backend/scripts/test-development-watch.cjs
      - run: docker build -f backend/Dockerfile -t guatswr-backend-runtime .
      - run: docker run --rm --network none -e JWT_SECRET=isolated-runtime-smoke-key -e BFF_BRIDGE_SECRET=synthetic-runtime-bridge-key-at-least-32 -e PORT=3000 guatswr-backend-runtime node scripts/runtime-smoke.cjs
      - run: docker run --rm --network none guatswr-backend-runtime node scripts/test-security-bridge.cjs
      - run: docker run --rm --network none guatswr-backend-runtime node scripts/test-member-binding.cjs
      - run: docker run --rm --network none guatswr-backend-runtime node scripts/test-upload-work-ownership.cjs
      - run: docker run --rm --network none guatswr-backend-runtime node scripts/test-lifecycle-signals.cjs
      - run: docker run --rm --network none guatswr-backend-runtime node scripts/test-backup-snapshot.cjs
      - run: docker run --rm --network none guatswr-backend-runtime node scripts/test-backup-concurrency.cjs
      - run: docker run --rm --network none guatswr-backend-runtime python3 scripts/backup_bundle_test.py
      - run: docker run --rm --network none --tmpfs /limited:rw,size=1m -e BACKUP_TEST_LIMIT_ROOT=/limited guatswr-backend-runtime node scripts/test-backup-restore.cjs
  real-bff:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:security
      - run: node --test scripts/revamp/upstream-security.test.mjs
      - run: pnpm --filter @guatswr/shared build
      - name: Verify packed shared ESM and CommonJS consumers
        run: |
          mkdir -p "$RUNNER_TEMP/shared-consumer"
          npm pack ./packages/shared --ignore-scripts --pack-destination "$RUNNER_TEMP/shared-consumer"
          cp "$RUNNER_TEMP/shared-consumer/"*.tgz "$RUNNER_TEMP/shared-consumer/shared.tgz"
          cp packages/shared/tests/consumer/* "$RUNNER_TEMP/shared-consumer/"
          docker build -t guatswr-shared-consumer "$RUNNER_TEMP/shared-consumer"
          docker run --rm --network none guatswr-shared-consumer
      - run: pnpm --filter @guatswr/web build
      - run: pnpm --filter guiair-backend run test:bff --reporter=default --reporter=json --outputFile=test-results/bff.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-real-bff
          path: backend/test-results
          retention-days: 14
