name: Revamp quality gates

on:
  push:
    branches: ['revamp/**']
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - 'packages/**'
      - 'scripts/revamp/**'
      - 'patches/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.node-version'
      - '.npmrc'
      - '.gitattributes'
      - '.github/workflows/revamp.yml'

permissions:
  contents: read

concurrency:
  group: revamp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build --file web/Dockerfile --tag guatswr-revamp:ci .
      - run: node scripts/revamp/container-smoke.mjs --image guatswr-revamp:ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: revamp-container-runtime
          path: .tools/container-runtime-validation.json
          include-hidden-files: true
          retention-days: 7
  foundation:
    # Both UIs are rendered in the same pinned browser for direct comparisons.
    # Every host runs the full functional, visual and build gate. The Lighthouse
    # budget is measured only on Linux, where the navigation trace is reliable;
    # a Windows run without a trace is an instrumentation failure, never a
    # performance pass, so it does not decide the budget.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Fresh-server E2E batches preserve the real production rate limiter.
    timeout-minutes: 60
    env:
      NUXT_SESSION_PASSWORD: ${{ secrets.REVAMP_TEST_SESSION_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Generate an ephemeral test session secret
        if: env.NUXT_SESSION_PASSWORD == ''
        shell: bash
        run: |
          secret=$(node -p "require('node:crypto').randomBytes(48).toString('hex')")
          echo "::add-mask::$secret"
          echo "NUXT_SESSION_PASSWORD=$secret" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:security
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: revamp-dependency-security-${{ runner.os }}
          path: .tools/dependency-security.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - run: pnpm test:tooling
      - run: pnpm check:boundaries
      - run: pnpm -r typecheck
      - run: pnpm -r lint
      - run: pnpm -r test
      - run: pnpm -r build
      - run: pnpm check:artifacts
      - run: pnpm --filter @guatswr/web exec playwright install chromium
        if: runner.os == 'Windows'
      - name: Install Chromium with Linux OS dependencies and CJK fonts
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes fonts-noto-cjk
          pnpm --filter @guatswr/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Account initial route JavaScript
        id: route-budget
        if: runner.os == 'Linux'
        run: node scripts/revamp/check-route-budget.mjs --routes scripts/revamp/route-fixtures.json > web/route-budget-report.json
      - id: performance
        if: runner.os == 'Linux'
        run: pnpm --filter @guatswr/web test:performance
      - name: Report performance medians on failure
        if: failure() && steps.performance.outcome == 'failure'
        shell: bash
        run: |
          if [ -f web/.lighthouseci/summary.json ]; then
            node -e "const s=require('./web/.lighthouseci/summary.json');console.log('::error title=Performance check::'+(s.failure||'')+' '+s.results.map(r=>new URL(r.url).pathname+' median '+r.median.lcpMs.toFixed(1)+' ms score '+r.median.performance+' runs ['+r.runs.map(x=>x.lcpMs.toFixed(0)).join('/')+']').join(' || '));"
          else
            echo "::error title=Performance budgets::summary.json missing - the performance step did not reach the summary"
          fi
      - uses: actions/upload-artifact@v4
        if: always() && steps.route-budget.outcome != 'skipped' && steps.route-budget.outcome != ''
        with:
          name: revamp-route-budget-${{ runner.os }}
          path: web/route-budget-report.json
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always() && steps.performance.outcome != 'skipped' && steps.performance.outcome != ''
        with:
          name: revamp-performance-${{ runner.os }}
          path: web/.lighthouseci/
          include-hidden-files: true
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: revamp-playwright-failure-${{ runner.os }}
          path: |
            web/playwright-report/
            web/test-results/
            web/.e2e-isolated/
            web/.lighthouseci/
            .tools/dependency-security.json
          include-hidden-files: true
          retention-days: 7
