services:
  guiair-backend:
    build:
      context: .
      args:
        IMAGE_REGISTRY: ""
    container_name: guatswr_backend
    restart: always
    ports:
      - "127.0.0.1:8088:3000"
    volumes:
      - ./:/app
      - /app/node_modules
      - ./data:/app/data
      - ./uploads:/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
