        eid:
          type: string
        url:
          type: string
        thumbUrl:
          type: string
          nullable: true
    LogItem:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        action:
          type: string
        detail:
          type: string
          nullable: true
        created_at:
          type: string
          nullable: true
        user_id:
          type: integer
          nullable: true
        user_avatar:
          type: string
          nullable: true
    AdminEventPendingListResponse:
      type: object
      properties:
        total:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/Event'
    AdminEventReviewRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [approve, reject]
    LogListResponse:
      type: object
      properties:
        total:
          type: integer
        logs:
          type: array
          items:
            $ref: '#/components/schemas/LogItem'
    LogStatsItem:
      type: object
      properties:
        username:
          type: string
        count:
          type: integer
        user_id:
          type: integer
          nullable: true
        user_avatar:
          type: string
          nullable: true
    LogStatsResponse:
      type: object
      properties:
        stats:
          type: array
          items:
            $ref: '#/components/schemas/LogStatsItem'
    BotActivityNotify:
      type: object
      required: [id, title, tag, date]
      properties:
        id:
          type: integer
        title:
          type: string
        tag:
          type: string
        date:
          type: string
        description:
          type: string
          nullable: true
        cover_image:
          type: string
          nullable: true
    BotHistoryNotify:
      type: object
      required: [id, date, title]
      properties:
        id:
          type: integer
        date:
          type: string
        title:
          type: string
        description:
          type: string
          nullable: true
        image:
          type: string
          nullable: true
        sort_order:
          type: integer
          nullable: true
        action:
          type: string
          enum: [create, update, delete]
    BotMemberNotify:
      type: object
      required: [id, name, role]
      properties:
        id:
          type: integer
        name:
          type: string
        role:
          type: string
        school:
          type: string
          nullable: true
        avatar:
          type: string
          nullable: true
    AdminUser:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        role:
          type: string
        avatar:
          type: string
          nullable: true
        twofa_enabled:
          type: integer
    AdminDeleteUserResponse:
      type: object
      properties:
        message:
          type: string
        target:
          type: string
    AdminResetPasswordRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
    TokenVersionRefreshResponse:
      type: object
      properties:
        message:
          type: string
        version:
          type: integer
    AdminLogListResponse:
      type: object
      properties:
        total:
          type: integer
        logs:
          type: array
          items:
            $ref: '#/components/schemas/AdminLogItem'
    AdminLogItem:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        action:
          type: string
        detail:
          type: string
          nullable: true
        created_at:
          type: string
          nullable: true
    RecycleBinPurgeResponse:
      type: object
      properties:
        message:
          type: string
        result:
          type: object
          properties:
            activities:
              type: integer
            members:
              type: integer
            history:
              type: integer
    BanItem:
      type: object
      properties:
        ip:
          type: string
        reason:
          type: string
          nullable: true
        created_by:
          type: string
          nullable: true
        created_at:
          type: string
          nullable: true
        expires_at:
          type: string
          nullable: true
    BanListResponse:
      type: object
      properties:
        bans:
          type: array
          items:
            $ref: '#/components/schemas/BanItem'
    BanCreateRequest:
      type: object
      required: [ip]
      properties:
