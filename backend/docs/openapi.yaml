openapi: 3.0.3
info:
  title: Guatswr Web API
  version: 4.0
  description: 核心模块 API 文档（auth、activities、members、history、event、config、upload、upload/visitor、logs、bot、admin）。
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /api/version:
    get:
      operationId: API_71
      x-contract-id: API-71
      summary: 获取服务版本
      tags: [system]
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                  status:
                    type: string
  /api/auth/login:
    post:
      operationId: API_28
      x-contract-id: API-28
      summary: 登录
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthLoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/auth/me:
    get:
      operationId: API_30
      x-contract-id: API-30
      summary: 获取当前用户
      tags: [auth]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMe'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/auth/profile:
    put:
      operationId: API_29
      x-contract-id: API-29
      summary: 更新个人资料
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/register:
    post:
      operationId: API_31
      x-contract-id: API-31
      summary: 创建管理员
      tags: [auth]
      description: 仅 super_admin 可用。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/activities:
    get:
      operationId: API_01
      x-contract-id: API-01
      summary: 活动列表
      tags: [activities]
      security: []
      parameters:
        - in: query
          name: all
          schema:
            type: string
            enum: ['0','1']
          description: 1 表示包含草稿/管理员可见内容（需要登录）
        - in: query
          name: includeDeleted
          schema:
            type: string
            enum: ['0','1']
          description: 1 表示包含已删除（仅 super_admin）
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: API_04
      x-contract-id: API-04
      summary: 发布活动
      tags: [activities]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/activities/draft:
    post:
      operationId: API_03
      x-contract-id: API-03
      summary: 创建草稿
      tags: [activities]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/activities/{id}:
    get:
      operationId: API_02
      x-contract-id: API-02
      summary: 活动详情
      tags: [activities]
      security: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: API_05
      x-contract-id: API-05
      summary: 更新活动
      tags: [activities]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      operationId: API_06
      x-contract-id: API-06
      summary: 软删除活动
      tags: [activities]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/activities/{id}/restore:
    post:
      operationId: API_07
      x-contract-id: API-07
      summary: 恢复活动
      tags: [activities]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/members:
    get:
      operationId: API_63
      x-contract-id: API-63
      summary: 成员列表
      tags: [members]
      security: []
      parameters:
        - in: query
          name: includeDeleted
          schema:
            type: string
            enum: ['0','1']
        - in: query
          name: original
          schema:
            type: string
            enum: ['0','1']
          description: 1 表示返回原图字段（avatar_original、avatar_thumb）
        - in: query
          name: school
          schema:
            type: string
          description: 按学校筛选
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Member'
    post:
      operationId: API_64
      x-contract-id: API-64
      summary: 添加成员
      tags: [members]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/members/stats/schools:
    get:
      operationId: API_62
      x-contract-id: API-62
      summary: 学校成员统计
      tags: [members]
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MemberSchoolStat'
  /api/members/{id}:
    put:
      operationId: API_65
      x-contract-id: API-65
      summary: 更新成员
      tags: [members]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      operationId: API_66
      x-contract-id: API-66
      summary: 软删除成员
      tags: [members]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/members/{id}/restore:
    post:
      operationId: API_67
      x-contract-id: API-67
      summary: 恢复成员
      tags: [members]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/history:
    get:
      operationId: API_54
      x-contract-id: API-54
      summary: 群史列表
      tags: [history]
      security: []
      parameters:
        - in: query
          name: includeDeleted
          schema:
            type: string
            enum: ['0','1']
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HistoryItem'
    post:
      operationId: API_55
      x-contract-id: API-55
      summary: 添加群史
      tags: [history]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HistoryInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/history/{id}:
    put:
      operationId: API_56
      x-contract-id: API-56
      summary: 更新群史
      tags: [history]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HistoryInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      operationId: API_57
      x-contract-id: API-57
      summary: 软删除群史
      tags: [history]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/history/{id}/restore:
    post:
      operationId: API_58
      x-contract-id: API-58
      summary: 恢复群史
      tags: [history]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/config:
    get:
      operationId: API_35
      x-contract-id: API-35
      summary: 获取站点配置
      tags: [config]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigMap'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: API_36
      x-contract-id: API-36
      summary: 更新站点配置
      tags: [config]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigUpdateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/upload:
    post:
      operationId: API_68
      x-contract-id: API-68
      summary: 上传文件
      tags: [upload]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      parameters:
        - in: query
          name: activityId
          schema:
            type: integer
        - in: query
          name: category
          schema:
            type: string
            description: 传 icon_svg 可直接存放到 icon 目录
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
  /api/upload/visitor:
    post:
      operationId: API_69
      x-contract-id: API-69
      summary: 访客上传事件图片
      tags: [upload]
      security:
        - bearerAuth: []
        - bffBridge: []
          guestDraftProof: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                eid:
                  type: string
                  description: 事件ID（也可用 query 参数）
      parameters:
        - in: query
          name: eid
          schema:
            type: string
          description: 事件ID（也可用表单字段）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadVisitorResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/event/draft:
    post:
      operationId: API_37
      x-contract-id: API-37
      summary: 创建事件草稿
      tags: [event]
      security:
        - bearerAuth: []
        - bffBridge: []
          guestDraftProof: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDraftResponse'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/event:
    get:
      operationId: API_39
      x-contract-id: API-39
      summary: 事件列表
      tags: [event]
      security: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - in: query
          name: type
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventListResponse'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/event/{id}:
    get:
      operationId: API_40
      x-contract-id: API-40
      summary: 事件详情
      tags: [event]
      security: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    put:
      operationId: API_38
      x-contract-id: API-38
      summary: 提交/更新事件
      tags: [event]
      security:
        - bearerAuth: []
        - bffBridge: []
          guestDraftProof: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventUpdateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventUpdateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/logs:
    get:
      operationId: API_59
      x-contract-id: API-59
      summary: 审计日志列表
      tags: [logs]
      parameters:
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: username
          schema:
            type: string
        - in: query
          name: action
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogListResponse'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/logs/stats:
    get:
      operationId: API_60
      x-contract-id: API-60
      summary: 编辑统计
      tags: [logs]
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogStatsResponse'
  /api/bot/notify/activity:
    post:
      operationId: API_32
      x-contract-id: API-32
      summary: 发送活动通知
      tags: [bot]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BotActivityNotify'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/BadGateway'
  /api/bot/notify/history:
    post:
      operationId: API_33
      x-contract-id: API-33
      summary: 发送群史通知
      tags: [bot]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BotHistoryNotify'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/BadGateway'
  /api/bot/notify/member:
    post:
      operationId: API_34
      x-contract-id: API-34
      summary: 发送成员通知
      tags: [bot]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BotMemberNotify'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/BadGateway'
  /api/admin/users:
    get:
      operationId: API_08
      x-contract-id: API-08
      summary: 管理员列表
      description: 仅 super_admin 可用。
      tags: [admin]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/admin/users/{id}:
    delete:
      operationId: API_09
      x-contract-id: API-09
      summary: 删除管理员
      description: 仅 super_admin 可用。
      tags: [admin]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDeleteUserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/admin/users/{id}/password:
    put:
      operationId: API_10
      x-contract-id: API-10
      summary: 重置管理员密码
      description: 仅 super_admin 可用。
      tags: [admin]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminResetPasswordRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/admin/users/{id}/twofa/reset:
    put:
      operationId: API_11
      x-contract-id: API-11
      summary: 重置管理员二步密码
      description: 仅 super_admin 可用。
      tags: [admin]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
