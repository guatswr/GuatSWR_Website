          type: string
        reason:
          type: string
          nullable: true
        minutes:
          type: integer
          nullable: true
    BanCreateResponse:
      type: object
      properties:
        message:
          type: string
        ip:
          type: string
    BanDeleteResponse:
      type: object
      properties:
        message:
          type: string
        ip:
          type: string
