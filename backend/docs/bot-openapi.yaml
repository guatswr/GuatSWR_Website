components:
  securitySchemes:
    botToken:
      type: http
      scheme: bearer
      description: Scoped gwb_ service token; never a website JWT.
    websiteJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
    bffBridge:
      type: apiKey
      in: header
      name: X-BFF-Bridge
      description: Trusted BFF peer/CIDR and a single X-Forwarded-For required. Guest requests also need X-Bot-Owner.
  schemas:
    CredentialInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        scopes:
          minItems: 1
          maxItems: 11
          type: array
          items:
            type: string
            enum:
              - query:read
              - subscriptions:write
              - identity:write
              - signup:write
              - signup:read
              - review:read
              - review:write
              - deliveries:read
              - deliveries:retry
              - members:sync
              - deliveries:ack
        groups:
          default: []
          maxItems: 100
          type: array
          items:
            type: string
            pattern: ^\d{5,12}$
      required:
        - name
        - scopes
      additionalProperties: false
    SubscriptionInput:
      type: object
      properties:
        group_id:
          type: string
          pattern: ^\d{5,12}$
        event:
          type: string
          enum:
            - activity.published
            - history.updated
            - member.added
            - event.pending
            - event.published
            - event.updated
            - event.approved
            - event.rejected
            - event.status
            - event.deleted
            - event.settled
            - event.result_set
            - event.signup
            - event.signup_cancelled
            - reminder.deadline
            - reminder.start
        event_id:
          type: integer
          minimum: 0
          exclusiveMinimum: true
          maximum: 9007199254740991
        lead_minutes:
          default: 60
          type: integer
          minimum: 1
          maximum: 10080
      required:
        - group_id
        - event
      additionalProperties: false
    BindInput:
      type: object
      properties:
        code:
          type: string
          pattern: ^[a-f0-9]{32}$
        qq:
          type: string
          pattern: ^\d{5,12}$
      required:
        - code
        - qq
      additionalProperties: false
    SignupInput:
      type: object
      properties:
        qq:
          type: string
          pattern: ^\d{5,12}$
        common_id:
          type: string
          minLength: 1
          maxLength: 100
        avatar:
          type: string
          maxLength: 500
          pattern: ^\/uploads\/
        machine_sign:
          default: ''
          type: string
          maxLength: 200
        pilot_source:
          default: ''
          type: string
          maxLength: 200
      required:
        - qq
        - common_id
        - avatar
      additionalProperties: false
    ReviewInput:
      type: object
      properties:
        qq:
          type: string
          pattern: ^\d{5,12}$
        action:
          type: string
          enum:
            - approve
            - reject
        reason:
          type: string
          minLength: 1
          maxLength: 500
      required:
        - qq
        - action
        - reason
      additionalProperties: false
    MemberSyncSettings:
      type: object
      properties:
        enabled:
          type: boolean
        credential_id:
          nullable: true
          type: string
          format: uuid
          pattern: >-
            ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        groups:
          maxItems: 20
          type: array
          items:
            type: string
            pattern: ^[1-9]\d{4,11}$
        interval_minutes:
          default: 360
          type: integer
          minimum: 30
          maximum: 10080
        admin_user_ids:
          maxItems: 20
          type: array
          items:
            type: integer
            minimum: 0
            exclusiveMinimum: true
            maximum: 9007199254740991
      required:
        - enabled
        - credential_id
        - groups
        - admin_user_ids
      additionalProperties: false
    MemberSyncBatch:
      type: object
      properties:
        members:
          maxItems: 500
          type: array
          items:
            type: object
            properties:
              qq:
                type: string
                pattern: ^[1-9]\d{4,11}$
              group_card:
                default: ''
                type: string
                maxLength: 50
              nickname:
                default: ''
                type: string
                maxLength: 50
              group_role:
                default: member
                type: string
                enum:
                  - member
                  - admin
                  - owner
            required:
              - qq
            additionalProperties: false
      required:
        - members
      additionalProperties: false
    MemberSyncComplete:
      type: object
      properties:
        batch_count:
          type: integer
          minimum: 1
          maximum: 100
        member_count:
          type: integer
          minimum: 0
          maximum: 10000
        complete:
          type: boolean
          enum:
            - true
      required:
        - batch_count
        - member_count
        - complete
      additionalProperties: false
    MemberSyncApply:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
        allow_large_drop:
          default: false
          type: boolean
        allow_unlinked:
          default: false
          type: boolean
      required:
        - reason
      additionalProperties: false
    MemberSyncProfile:
      type: object
      properties:
        qq:
          nullable: true
          type: string
          pattern: ^[1-9]\d{4,11}$
        follow_group_name:
          type: boolean
        follow_group_avatar:
          type: boolean
        sync_protected:
          type: boolean
        complete:
          type: boolean
      required:
        - qq
        - follow_group_name
        - follow_group_avatar
        - sync_protected
        - complete
      additionalProperties: false
    BotReceipt:
      type: object
      properties:
        status:
          type: string
          enum:
            - sent
            - failed
        error_code:
          type: string
          enum:
            - unavailable
            - not_friend
            - rate_limited
            - unknown
      required:
        - status
      additionalProperties: false
    Error:
      type: object
      required:
        - message
      properties:
        message:
          type: string
    MemberSyncRequest:
      type: object
      required:
        - group_id
      additionalProperties: false
      properties:
        group_id:
          type: string
          pattern: ^[1-9]\d{4,11}$
    OnThisDayItem:
      type: object
      required:
        - source
        - id
        - title
        - date
        - years_ago
        - description
        - image
        - image_url
        - images
        - images_truncated
        - tag
        - url
      properties:
        source:
          type: string
          enum:
            - articles
            - history
        id:
          type: integer
        title:
          type: string
          maxLength: 200
        date:
          type: string
          format: date
        years_ago:
          type: integer
          minimum: 1
        description:
          type: string
          maxLength: 500
        image:
          type: string
        tag:
          type: string
        image_url:
          type: string
          description: First available public image as absolute HTTP(S) URL; empty if unavailable.
        images:
          type: array
          maxItems: 50
          items:
            type: string
            format: uri
          description: >-
            Articles: at most one available cover, without gallery/body fallback. History: deduplicated
            primary/description images. Absolute public URLs.
        images_truncated:
          type: boolean
          description: >-
            History image count, candidate count or description extraction budget was reached; always false
            for articles.
        url:
          type: string
          description: Relative website URL; articles use /activity/:id, history uses /history.
    OnThisDayResponse:
      type: object
      required:
        - date
        - month_day
        - timezone
        - source
        - page
        - limit
        - total
        - has_more
        - items
        - broadcast_text
        - broadcast_images
      properties:
        date:
          type: string
          format: date
        month_day:
          type: string
          pattern: ^\d{2}-\d{2}$
        timezone:
          type: string
          enum:
            - Asia/Shanghai
        source:
          type: string
          enum:
            - all
            - articles
            - history
        page:
          type: integer
          minimum: 1
          maximum: 1000000
        limit:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        has_more:
          type: boolean
        broadcast_text:
          type: string
          description: Plain-text digest of this page only; no automatic message delivery.
        broadcast_images:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uri
          description: >-
            Deduplicated image URLs from this page, to accompany broadcast_text without sending a Bot token to
            image URLs.
        items:
          type: array
          items:
            $ref: '#/components/schemas/OnThisDayItem'
