name: guatswr

services:
  backend:
    image: guatswr-backend:${BACKEND_SOURCE_REVISION:-local}
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        IMAGE_REGISTRY: ${IMAGE_REGISTRY:-}
        SOURCE_REVISION: ${BACKEND_SOURCE_REVISION:-unknown}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    labels:
      io.guatswr.health-recovery.enabled: "true"
    mem_limit: ${BACKEND_MEMORY_LIMIT:-1g}
    pids_limit: ${BACKEND_PIDS_LIMIT:-256}
    cpus: ${BACKEND_CPU_LIMIT:-1.5}
    init: true
    stop_grace_period: 30s
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    env_file:
      - ${BACKEND_ENV_FILE:-./backend/.env}
    environment:
      NODE_ENV: production
      PORT: "3000"
      BIND_HOST: 0.0.0.0
      DATA_DIR: /app/data
      PUBLIC_DIR: /app/data/public
      BACKUP_ROOT: /app/backups
      # Trust only the BFF container, including for guest bridge requests.
      TRUST_PROXY_CIDRS: ${DOCKER_WEB_IP:-172.30.88.10}/32
    # No host port: only web can reach the backend over the Compose network.
    expose:
      - "3000"
    volumes:
      - type: bind
        source: ${BACKEND_DATA_DIR:-./backend/data}
        target: /app/data
        bind:
          create_host_path: false
      - type: bind
        source: ${BACKEND_BACKUP_DIR:-./backend/backups}
        target: /app/backups
        bind:
          create_host_path: false
    networks:
      - app
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: guatswr-web:${BACKEND_SOURCE_REVISION:-local}
    build:
      context: .
      dockerfile: web/Dockerfile
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    labels:
      io.guatswr.health-recovery.enabled: "true"
    mem_limit: ${WEB_MEMORY_LIMIT:-1g}
    pids_limit: ${WEB_PIDS_LIMIT:-256}
    cpus: ${WEB_CPU_LIMIT:-1.5}
    init: true
    stop_grace_period: 30s
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    env_file:
      - ${WEB_ENV_FILE:-./web/.env.production}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3100"
      BFF_STATE_DIR: /app/state
      NUXT_API_BASE: http://backend:3000
      NUXT_KOMARI_BASE_URL: ${NUXT_KOMARI_BASE_URL:-http://komari:25774}
      # Host Nginx/Caddy reaches this container through the bridge gateway.
      NUXT_BFF_AUTH_TRUSTED_PROXY_CIDRS: '["${DOCKER_GATEWAY:-172.30.88.1}/32"]'
    volumes:
      - bff-state:/app/state
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3100}:3100"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      app:
        ipv4_address: ${DOCKER_WEB_IP:-172.30.88.10}

  umami:
    image: ${UMAMI_IMAGE:-ghcr.nju.edu.cn/umami-software/umami@sha256:e69d1a7932e9dab0fc523edc7be1f3a53f3c261f57856fc2167ae74a8fc022e8}
    container_name: ${UMAMI_CONTAINER_NAME:-umami}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    mem_limit: ${UMAMI_MEMORY_LIMIT:-512m}
    pids_limit: ${UMAMI_PIDS_LIMIT:-128}
    cpus: ${UMAMI_CPU_LIMIT:-1.0}
    ports:
      - "${UMAMI_BIND_ADDRESS:-127.0.0.1}:${UMAMI_PORT:-13036}:3000"
    environment:
      DATABASE_URL: postgresql://${UMAMI_DB_USER:-umami}:${UMAMI_DB_PASSWORD:-umami}@umami-db:5432/${UMAMI_DB_NAME:-umami}
      DATABASE_TYPE: postgresql
      HASH_SALT: ${UMAMI_HASH_SALT:-}
      CLIENT_IP_HEADER: ${UMAMI_CLIENT_IP_HEADER:-x-real-ip}
      SKIP_LOCATION_HEADERS: "${UMAMI_SKIP_LOCATION_HEADERS:-1}"
      GEOLITE_DB_PATH: ${UMAMI_GEOLITE_DB_PATH:-/geo/GeoLite2-City.mmdb}
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - type: bind
        source: ${UMAMI_GEO_DIR:-./deploy/umami/geo}
        target: /geo
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      umami-db:
        condition: service_healthy
    networks:
      app:
        ipv4_address: ${DOCKER_UMAMI_IP:-172.30.88.20}
        aliases:
          - umami
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  umami-db:
    image: ${UMAMI_DB_IMAGE:-postgres:15-alpine}
    container_name: ${UMAMI_DB_CONTAINER_NAME:-umami-db}
    restart: unless-stopped
    mem_limit: ${UMAMI_DB_MEMORY_LIMIT:-512m}
    pids_limit: ${UMAMI_DB_PIDS_LIMIT:-128}
    cpus: ${UMAMI_DB_CPU_LIMIT:-1.0}
    environment:
      POSTGRES_DB: ${UMAMI_DB_NAME:-umami}
      POSTGRES_USER: ${UMAMI_DB_USER:-umami}
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD:-umami}
    volumes:
      - type: bind
        source: ${UMAMI_DB_DATA_DIR:-./deploy/umami/data/db}
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${UMAMI_DB_USER:-umami} -d ${UMAMI_DB_NAME:-umami}"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      app:
        aliases:
          - db
          - umami-db
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  komari:
    image: ${KOMARI_IMAGE:-ghcr.1ms.run/komari-monitor/komari:latest}
    container_name: ${KOMARI_CONTAINER_NAME:-komari}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    mem_limit: ${KOMARI_MEMORY_LIMIT:-256m}
    pids_limit: ${KOMARI_PIDS_LIMIT:-64}
    cpus: ${KOMARI_CPU_LIMIT:-0.5}
    ports:
      - "${KOMARI_BIND_ADDRESS:-127.0.0.1}:${KOMARI_PORT:-25774}:25774"
    volumes:
      - type: bind
        source: ${KOMARI_DATA_DIR:-./deploy/komari/data}
        target: /app/data
        bind:
          create_host_path: false
    networks:
      app:
        ipv4_address: ${DOCKER_KOMARI_IP:-172.30.88.30}
        aliases:
          - komari
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18.6-bookworm@sha256:f1ea2a1a4fb7b68d4836be1fdcb8a6466a89b072158bf9d97663600538c294c5}
    container_name: ${POSTGRES_CONTAINER_NAME:-guatswr-postgres}
    restart: unless-stopped
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-512m}
    pids_limit: ${POSTGRES_PIDS_LIMIT:-128}
    cpus: ${POSTGRES_CPU_LIMIT:-1.0}
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-guatswr_admin}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
    volumes:
      - type: bind
        source: ${POSTGRES_DATA_DIR:-./deploy/postgres/data}
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER:-guatswr_admin} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      app:
        ipv4_address: ${DOCKER_POSTGRES_IP:-172.30.88.15}
        aliases:
          - postgres
          - guatswr-postgres
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  app:
    driver: bridge
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-172.30.88.0/24}
          gateway: ${DOCKER_GATEWAY:-172.30.88.1}

volumes:
  bff-state:
